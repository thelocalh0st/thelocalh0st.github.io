<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The number ARTEX writes on what it touches. In the code, every goal, intent, fact and finding is a row in exploration_nodes with an id from one BIGSERIAL counter per ARTEX database, and each worker runs in a folder named i followed by its intent id, in a session named exp N worker i intent id. Bitrise's artefacts carry numbers of the same shape on one rising scale: usernames i871-probe, i1040probe and i3694canary, the user agent pentest-probe-i5938/1.0 seen on 12,813 requests, and the path /_i6084_probe_missing. The same number in two systems points to the same intent; a larger number came later from the same instance. The zz control markers are not in the code at all; the model invents them.">
  <title>The number ARTEX writes on what it touches</title>
  <defs><pattern id="dotsI" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#e2e8f0"/></pattern></defs>
  <style>
    .s { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-variant-ligatures: none; white-space: pre; }
    .pin { animation: drop .5s ease-out both; } .p2 { animation-delay: .15s; } .p3 { animation-delay: .3s; } .p4 { animation-delay: .45s; } .p5 { animation-delay: .6s; }
    .axis { stroke-dasharray: 1040; animation: draw 1.2s ease-out both; }
    @keyframes drop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 1040; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="560" rx="22" fill="#ffffff"/>
  <rect width="1200" height="560" rx="22" fill="url(#dotsI)"/>
  <rect x=".5" y=".5" width="1199" height="559" rx="22" fill="none" stroke="#e2e8f0"/>
  <text x="48" y="52" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#be123c">JOIN KEYS</text>
  <text x="48" y="86" class="s" font-size="26" font-weight="700" fill="#0f172a">The number ARTEX writes on what it touches</text>

  <rect x="48" y="110" width="1104" height="74" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="68" y="138" class="s" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">IN THE CODE</text>
  <text x="68" y="166" class="m" font-size="13" fill="#0f172a">exploration_nodes.id BIGSERIAL</text>
  <text x="326" y="166" class="s" font-size="13" fill="#64748b">one counter per ARTEX database: every goal, intent, fact and finding takes the next number</text>
  <rect x="48" y="194" width="1104" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="68" y="222" class="m" font-size="13" fill="#9a3412">tasks/&lt;task&gt;/i&lt;intentID&gt;</text>
  <text x="300" y="222" class="s" font-size="13" fill="#64748b">worker folder</text>
  <text x="430" y="222" class="m" font-size="13" fill="#9a3412">exp&lt;N&gt;-worker-i&lt;intentID&gt;</text>
  <text x="664" y="222" class="s" font-size="13" fill="#64748b">worker session name (agent/worker.go)</text>

  <!-- number line 0..7000 -> x 80..1120 -->
  <text x="48" y="276" class="s" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">IN ONE VICTIM'S LOGS (BITRISE)</text>
  <line x1="80" y1="378" x2="1120" y2="378" stroke="#cbd5e1" stroke-width="3" class="axis"/>
  <g class="s" font-size="11" fill="#94a3b8" text-anchor="middle">
    <line x1="80" y1="372" x2="80" y2="384" stroke="#cbd5e1"/><text x="80" y="400">0</text>
    <line x1="228.6" y1="372" x2="228.6" y2="384" stroke="#cbd5e1"/><text x="228.6" y="400">1,000</text>
    <line x1="377.1" y1="372" x2="377.1" y2="384" stroke="#cbd5e1"/><text x="377.1" y="400">2,000</text>
    <line x1="525.7" y1="372" x2="525.7" y2="384" stroke="#cbd5e1"/><text x="525.7" y="400">3,000</text>
    <line x1="674.3" y1="372" x2="674.3" y2="384" stroke="#cbd5e1"/><text x="674.3" y="400">4,000</text>
    <line x1="822.9" y1="372" x2="822.9" y2="384" stroke="#cbd5e1"/><text x="822.9" y="400">5,000</text>
    <line x1="971.4" y1="372" x2="971.4" y2="384" stroke="#cbd5e1"/><text x="971.4" y="400">6,000</text>
    <line x1="1120" y1="372" x2="1120" y2="384" stroke="#cbd5e1"/><text x="1120" y="400">7,000</text>
  </g>
  <!-- 871 -> 209.4 ; 1040 -> 234.6 ; 3694 -> 628.9 ; 5938 -> 962.2 ; 6084 -> 983.9 -->
  <g class="pin"><line x1="209.4" y1="378" x2="209.4" y2="312" stroke="#e11d48" stroke-width="2"/><circle cx="209.4" cy="378" r="6" fill="#e11d48"/>
    <text x="120" y="300" class="m" font-size="13" font-weight="700" fill="#be123c">i871-probe</text><text x="120" y="318" class="s" font-size="11.5" fill="#64748b">username</text></g>
  <g class="pin p2"><line x1="234.6" y1="378" x2="234.6" y2="436" stroke="#e11d48" stroke-width="2"/><circle cx="234.6" cy="378" r="6" fill="#e11d48"/>
    <text x="200" y="456" class="m" font-size="13" font-weight="700" fill="#be123c">i1040probe</text><text x="200" y="474" class="s" font-size="11.5" fill="#64748b">username</text></g>
  <g class="pin p3"><line x1="628.9" y1="378" x2="628.9" y2="312" stroke="#e11d48" stroke-width="2"/><circle cx="628.9" cy="378" r="6" fill="#e11d48"/>
    <text x="576" y="300" class="m" font-size="13" font-weight="700" fill="#be123c">i3694canary</text><text x="576" y="318" class="s" font-size="11.5" fill="#64748b">username</text></g>
  <g class="pin p4"><line x1="962.2" y1="378" x2="962.2" y2="312" stroke="#e11d48" stroke-width="2"/><circle cx="962.2" cy="378" r="6" fill="#e11d48"/>
    <text x="808" y="300" class="m" font-size="13" font-weight="700" fill="#be123c">pentest-probe-i5938/1.0</text><text x="808" y="318" class="s" font-size="11.5" fill="#64748b">user agent, 12,813 requests</text></g>
  <g class="pin p5"><line x1="983.9" y1="378" x2="983.9" y2="436" stroke="#e11d48" stroke-width="2"/><circle cx="983.9" cy="378" r="6" fill="#e11d48"/>
    <text x="930" y="456" class="m" font-size="13" font-weight="700" fill="#be123c">/_i6084_probe_missing</text><text x="930" y="474" class="s" font-size="11.5" fill="#64748b">control-404 path</text></g>

  <!-- how to use -->
  <rect x="48" y="494" width="1104" height="40" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="68" y="519" class="s" font-size="13.5" fill="#312e81"><tspan font-weight="700">Same number in two systems</tspan> = same intent.  <tspan font-weight="700">Larger number</tspan> = later work by the same instance.  <tspan font-weight="700">zz markers</tspan> are not in the code: the model invents them.</text>
  <text x="48" y="552" class="s" font-size="11" fill="#94a3b8">Code: db/schema.sql, agent/worker.go (ARTEX v0.3.15). Values: Bitrise incident report v1.6. Reading them as intent ids is an inference from the code.</text>
</svg>
