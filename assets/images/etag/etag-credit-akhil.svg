<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Observation credit: Akhil, the friend who looks at the column everyone scrolls past and asks, wait, why is this here?">
  <title>Observation credit: Akhil</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset=".55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#062a33"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".35" stop-color="#fb7185"/>
      <stop offset=".7" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0; 300 0; -300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="medal" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset=".55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-variant-ligatures: none; }
    .fall { animation: fall 6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-60px) rotate(0deg); } 100% { transform: translateY(520px) rotate(540deg); } }
    .f { transform-box: fill-box; transform-origin: center; }
    .lens { animation: lens 6s ease-in-out infinite; }
    @keyframes lens { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(470px, 6px); } }
    .ticker { animation: ticker 22s linear infinite; }
    @keyframes ticker { to { transform: translateX(-1200px); } }
    .medal { transform-box: fill-box; transform-origin: center; animation: wobble 4s ease-in-out infinite; }
    @keyframes wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fall, .lens { display: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <!-- confetti -->
    <g>
      <rect class="f fall" x="80" y="0" width="10" height="16" rx="2" fill="#fbbf24" style="animation-delay:-0.4s"/>
      <rect class="f fall" x="160" y="0" width="8" height="14" rx="2" fill="#22d3ee" style="animation-delay:-2.1s"/>
      <rect class="f fall" x="250" y="0" width="12" height="8" rx="2" fill="#fb7185" style="animation-delay:-4.3s"/>
      <rect class="f fall" x="330" y="0" width="9" height="15" rx="2" fill="#a78bfa" style="animation-delay:-1.2s"/>
      <rect class="f fall" x="420" y="0" width="10" height="10" rx="5" fill="#4ade80" style="animation-delay:-3.3s"/>
      <rect class="f fall" x="505" y="0" width="8" height="16" rx="2" fill="#fbbf24" style="animation-delay:-5.1s"/>
      <rect class="f fall" x="590" y="0" width="12" height="8" rx="2" fill="#22d3ee" style="animation-delay:-0.9s"/>
      <rect class="f fall" x="670" y="0" width="9" height="14" rx="2" fill="#fb7185" style="animation-delay:-2.8s"/>
      <rect class="f fall" x="760" y="0" width="10" height="10" rx="5" fill="#a78bfa" style="animation-delay:-4.8s"/>
      <rect class="f fall" x="840" y="0" width="8" height="15" rx="2" fill="#4ade80" style="animation-delay:-1.7s"/>
      <rect class="f fall" x="925" y="0" width="12" height="8" rx="2" fill="#fbbf24" style="animation-delay:-3.9s"/>
      <rect class="f fall" x="1010" y="0" width="9" height="16" rx="2" fill="#22d3ee" style="animation-delay:-0.2s"/>
      <rect class="f fall" x="1090" y="0" width="10" height="10" rx="5" fill="#fb7185" style="animation-delay:-2.5s"/>
      <rect class="f fall" x="1150" y="0" width="8" height="14" rx="2" fill="#a78bfa" style="animation-delay:-5.6s"/>
      <rect class="f fall" x="40" y="0" width="9" height="9" rx="4.5" fill="#22d3ee" style="animation-delay:-3.6s"/>
      <rect class="f fall" x="460" y="0" width="7" height="13" rx="2" fill="#fb7185" style="animation-delay:-1.5s"/>
      <rect class="f fall" x="880" y="0" width="7" height="13" rx="2" fill="#fbbf24" style="animation-delay:-4.1s"/>
    </g>

    <!-- medal -->
    <g class="medal">
      <path d="M150 250 L118 360 L152 344 L170 376 L196 262 Z" fill="#be123c"/>
      <path d="M230 250 L262 360 L228 344 L210 376 L184 262 Z" fill="#7c3aed"/>
      <circle cx="190" cy="190" r="98" fill="url(#medal)" stroke="#fde68a" stroke-width="4"/>
      <circle cx="190" cy="190" r="80" fill="none" stroke="#92400e" stroke-width="2" stroke-dasharray="3 6"/>
      <g transform="translate(190 182)">
        <circle cx="-8" cy="-8" r="34" fill="#fff7ed" fill-opacity=".25" stroke="#451a03" stroke-width="9"/>
        <line x1="17" y1="17" x2="46" y2="46" stroke="#451a03" stroke-width="13" stroke-linecap="round"/>
      </g>
      <text x="190" y="262" text-anchor="middle" class="sans" font-size="15" font-weight="900" letter-spacing="2" fill="#451a03">OBSERVER</text>
    </g>

    <!-- text -->
    <text x="360" y="104" class="sans" font-size="16" font-weight="700" letter-spacing="4" fill="#fcd34d">OBSERVATION CREDIT</text>
    <text x="356" y="236" class="sans" font-size="136" font-weight="900" letter-spacing="6" fill="url(#name)">AKHIL</text>

    <!-- magnifier sweeping the name -->
    <g class="lens">
      <circle cx="420" cy="186" r="62" fill="#ffffff" fill-opacity=".07" stroke="#e2e8f0" stroke-width="6"/>
      <line x1="464" y1="230" x2="506" y2="272" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
    </g>

    <text x="360" y="300" class="sans" font-size="22" fill="#e2e8f0">The friend who looks at the column everyone scrolls past</text>
    <text x="360" y="332" class="sans" font-size="22" fill="#e2e8f0">and asks: <tspan font-style="italic" fill="#fcd34d">"wait… why is this here?"</tspan></text>

    <!-- ticker -->
    <rect y="376" width="1200" height="64" fill="#000" fill-opacity=".35"/>
    <g class="ticker">
      <text x="0" y="416" class="mono" font-size="20" fill="#94a3b8" xml:space="preserve" textLength="1200" lengthAdjust="spacing">ETag ✦ Last-Modified ✦ If-Range ✦ downloads.etag ✦ total_bytes ✦ 304 Not Modified ✦ strong validators ✦ </text>
      <text x="1200" y="416" class="mono" font-size="20" fill="#94a3b8" xml:space="preserve" textLength="1200" lengthAdjust="spacing">ETag ✦ Last-Modified ✦ If-Range ✦ downloads.etag ✦ total_bytes ✦ 304 Not Modified ✦ strong validators ✦ </text>
    </g>
  </g>
</svg>
