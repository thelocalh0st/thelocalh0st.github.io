<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Correlation board. The suspect's History DB and the investigator's acquisition agree on URL, strong ETag 6ac46e19-13e7f8, Last-Modified Tue 06 Oct 2026 03:42:17 GMT, and size 1,304,568 bytes. The victim's hash column is empty, so the investigator's SHA-256 a5d87cbb...5d08ca8848 is carried over.">
  <title>Correlating the victim's download with today's acquisition</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <g id="ok">
      <circle r="15" fill="#16a34a"/>
      <path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#f0fdf4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-variant-ligatures: none; }
    .scan { animation: scan 12s linear infinite; }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; } 2% { opacity: 1; }
      10% { transform: translateY(0); } 18% { transform: translateY(66px); } 26% { transform: translateY(132px); }
      34% { transform: translateY(198px); } 42% { transform: translateY(264px); } 50% { transform: translateY(330px); }
      56% { transform: translateY(330px); opacity: 1; } 60%, 100% { transform: translateY(330px); opacity: 0; }
    }
    .c { transform-box: fill-box; transform-origin: center; }
    .c1 { animation: c1 12s ease-out infinite; } .c2 { animation: c2 12s ease-out infinite; }
    .c3 { animation: c3 12s ease-out infinite; } .c4 { animation: c4 12s ease-out infinite; }
    .c5 { animation: c5 12s ease-out infinite; } .c6 { animation: c6 12s ease-out infinite; }
    @keyframes c1 { 0%, 8% { transform: scale(0); } 11% { transform: scale(1.3); } 13%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes c2 { 0%, 16% { transform: scale(0); } 19% { transform: scale(1.3); } 21%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes c3 { 0%, 24% { transform: scale(0); } 27% { transform: scale(1.3); } 29%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes c4 { 0%, 32% { transform: scale(0); } 35% { transform: scale(1.3); } 37%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes c5 { 0%, 40% { transform: scale(0); } 43% { transform: scale(1.3); } 45%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    @keyframes c6 { 0%, 48% { transform: scale(0); } 51% { transform: scale(1.3); } 53%, 97% { transform: scale(1); } 100% { transform: scale(0); } }
    .verdict { animation: verdict 12s ease-out infinite; }
    @keyframes verdict { 0%, 58% { opacity: 0; } 64%, 97% { opacity: 1; } 100% { opacity: 0; } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 12s ease-out infinite; }
    @keyframes stamp { 0%, 64% { transform: rotate(-12deg) scale(2.4); opacity: 0; } 68% { transform: rotate(-12deg) scale(.92); opacity: 1; } 70%, 97% { transform: rotate(-12deg) scale(1); opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .scan { display: none; } .stamp { transform: rotate(-12deg); } }
  </style>

  <rect width="1200" height="720" rx="22" fill="#0b1220"/>
  <rect width="1200" height="720" rx="22" fill="url(#grid)" opacity=".55"/>

  <text x="48" y="58" class="sans" font-size="15" font-weight="700" letter-spacing="3" fill="#4ade80">CORRELATION</text>
  <text x="48" y="96" class="sans" font-size="30" font-weight="700" fill="#f8fafc">Line up the receipt with today's download</text>

  <!-- header -->
  <g class="sans" font-size="14" font-weight="700" letter-spacing="1.5">
    <text x="64" y="146" fill="#94a3b8">ATTRIBUTE</text>
    <text x="300" y="146" fill="#fbbf24">SUSPECT'S HISTORY DB · DAY 0</text>
    <text x="664" y="146" fill="#22d3ee">OUR ACQUISITION · DAY 15</text>
    <text x="1080" y="146" text-anchor="middle" fill="#94a3b8">RESULT</text>
  </g>
  <line x1="56" y1="160" x2="1144" y2="160" stroke="#334155" stroke-width="2"/>

  <!-- scanning highlight -->
  <rect x="56" y="166" width="1088" height="60" rx="8" fill="#22d3ee" opacity=".08" class="scan"/>

  <!-- rows: y centers 196, 262, 328, 394, 460, 526 -->
  <g class="mono" font-size="17">
    <g>
      <text x="64" y="202" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">Download URL</text>
      <text x="300" y="202" fill="#fde68a">…/download?id=7f3a9c</text>
      <text x="664" y="202" fill="#a5f3fc">…/download?id=7f3a9c</text>
      <use href="#ok" x="1080" y="196" class="c c1"/>
    </g>
    <line x1="56" y1="229" x2="1144" y2="229" stroke="#1e293b"/>
    <g>
      <text x="64" y="268" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">ETag (strong)</text>
      <text x="300" y="268" fill="#fbbf24" font-weight="700">"6ac46e19-13e7f8"</text>
      <text x="664" y="268" fill="#fbbf24" font-weight="700">"6ac46e19-13e7f8"</text>
      <use href="#ok" x="1080" y="262" class="c c2"/>
    </g>
    <line x1="56" y1="295" x2="1144" y2="295" stroke="#1e293b"/>
    <g>
      <text x="64" y="334" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">Last-Modified</text>
      <text x="300" y="334" fill="#fde68a">06 Oct 2026 03:42:17 GMT</text>
      <text x="664" y="334" fill="#a5f3fc">06 Oct 2026 03:42:17 GMT</text>
      <use href="#ok" x="1080" y="328" class="c c3"/>
    </g>
    <line x1="56" y1="361" x2="1144" y2="361" stroke="#1e293b"/>
    <g>
      <text x="64" y="400" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">Size</text>
      <text x="300" y="400" fill="#fde68a">total_bytes 1,304,568</text>
      <text x="664" y="400" fill="#a5f3fc">Content-Length 1,304,568</text>
      <use href="#ok" x="1080" y="394" class="c c4"/>
    </g>
    <line x1="56" y1="427" x2="1144" y2="427" stroke="#1e293b"/>
    <g>
      <text x="64" y="466" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">Order of events</text>
      <text x="300" y="466" fill="#fde68a">Last-Modified &lt; start_time</text>
      <text x="664" y="466" fill="#a5f3fc">validators unchanged</text>
      <use href="#ok" x="1080" y="460" class="c c5"/>
    </g>
    <line x1="56" y1="493" x2="1144" y2="493" stroke="#1e293b"/>
    <g>
      <text x="64" y="532" class="sans" font-size="18" font-weight="700" fill="#e2e8f0">SHA-256</text>
      <text x="300" y="532" fill="#fb7185">(hash column empty)</text>
      <text x="664" y="532" fill="#86efac">a5d87cbb…5d08ca8848</text>
      <g class="c c6">
        <rect x="1036" y="512" width="88" height="30" rx="15" fill="#14532d" stroke="#4ade80"/>
        <text x="1080" y="532" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#bbf7d0">⇐ carry</text>
      </g>
    </g>
  </g>

  <!-- verdict -->
  <g class="verdict">
    <rect x="56" y="572" width="1088" height="112" rx="16" fill="#0d2418" stroke="#4ade80" stroke-width="2"/>
    <text x="84" y="614" class="sans" font-size="21" font-weight="700" fill="#bbf7d0">Same URL · same strong ETag · same Last-Modified · same size</text>
    <text x="84" y="650" class="sans" font-size="18" fill="#dcfce7">→ the server handed out the same representation on Day 0 and Day 15.</text>
    <text x="84" y="674" class="sans" font-size="15" fill="#86efac">Our SHA-256 becomes the best available stand-in for the file the victim received.</text>
  </g>
  <g class="stamp">
    <rect x="930" y="586" width="186" height="74" rx="10" fill="none" stroke="#4ade80" stroke-width="5"/>
    <text x="1023" y="637" text-anchor="middle" class="sans" font-size="34" font-weight="900" letter-spacing="4" fill="#4ade80">MATCH</text>
  </g>
</svg>
