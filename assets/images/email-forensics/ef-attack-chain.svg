<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Attack chain. One phishing email reached eight finance mailboxes. Path one: Priya opened the HTML attachment, entered credentials on an adversary-in-the-middle page, the attacker signed in, created a hiding and forwarding inbox rule and emailed Treasury for a bank change. Path two: Marcus clicked the link, ran a JavaScript dropper, PowerShell downloaded a DLL that persisted with a scheduled task and beaconed to C2 every five minutes.">
  <title>One email, two payloads</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker>
    <path id="laneA" d="M300 250 C 318 250, 318 210, 336 210 H 1150"/>
    <path id="laneB" d="M300 330 C 318 330, 318 420, 336 420 H 1150"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif; }
    .mono { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-variant-ligatures: none; }
    .n { animation: n 12s ease-out infinite; }
    .n1 { animation-delay: -11.6s; } .n2 { animation-delay: -10.9s; } .n3 { animation-delay: -10.2s; } .n4 { animation-delay: -9.5s; } .n5 { animation-delay: -8.8s; }
    @keyframes n { 0% { opacity: .35; } 4%, 92% { opacity: 1; } 100% { opacity: .35; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .dot { display: none; } }
  </style>

  <rect width="1200" height="660" rx="22" fill="#0b1220"/>
  <rect width="1200" height="660" rx="22" fill="url(#grid)" opacity=".55"/>
  <text x="48" y="58" class="sans" font-size="15" font-weight="700" letter-spacing="3" fill="#60a5fa">CASE IR-2026-1022 · THE SHAPE OF IT</text>
  <text x="48" y="96" class="sans" font-size="30" font-weight="700" fill="#f8fafc">One email, two payloads, three things to contain</text>

  <!-- the email -->
  <g class="pulse">
    <rect x="48" y="196" width="252" height="190" rx="16" fill="#0f1b33" stroke="#60a5fa" stroke-width="2"/>
    <path d="M78 226 h72 v48 h-72 z M78 226 l36 26 l36 -26" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="166" y="244" class="sans" font-size="15" font-weight="700" fill="#bfdbfe">Invoice lure</text>
    <text x="166" y="266" class="sans" font-size="13" fill="#94a3b8">INV-88412 · $48,920</text>
    <text x="70" y="306" class="mono" font-size="12" fill="#e2e8f0">accounts@contoso-payments[.]co</text>
    <text x="72" y="334" class="sans" font-size="14" fill="#cbd5e1">8 recipients · 2 waves</text>
    <text x="72" y="358" class="sans" font-size="14" fill="#cbd5e1">6 delivered · 1 junk · 1 quarantined</text>
  </g>

  <use href="#laneA" xlink:href="#laneA" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 7" opacity=".7"/>
  <use href="#laneB" xlink:href="#laneB" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6 7" opacity=".7"/>

  <!-- lane labels -->
  <text x="336" y="156" class="sans" font-size="14" font-weight="700" letter-spacing="2" fill="#fbbf24">PATH 1 · THE ATTACHMENT · PRIYA, FIN-LT-042</text>
  <text x="336" y="368" class="sans" font-size="14" font-weight="700" letter-spacing="2" fill="#fda4af">PATH 2 · THE LINK · MARCUS, FIN-LT-017</text>

  <!-- lane A nodes -->
  <g class="sans">
    <g class="n n1"><rect x="336" y="170" width="152" height="80" rx="12" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
      <text x="412" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">INV-88412.html</text>
      <text x="412" y="226" text-anchor="middle" font-size="13" fill="#fcd34d">opened 09:21</text></g>
    <g class="n n2"><rect x="504" y="170" width="152" height="80" rx="12" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
      <text x="580" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">AiTM sign-in page</text>
      <text x="580" y="226" text-anchor="middle" font-size="13" fill="#fcd34d">m365-auth.…</text></g>
    <g class="n n3"><rect x="672" y="170" width="152" height="80" rx="12" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
      <text x="748" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">Session replayed</text>
      <text x="748" y="226" text-anchor="middle" font-size="13" fill="#fcd34d">203.0.113.150 · 09:23</text></g>
    <g class="n n4"><rect x="840" y="170" width="152" height="80" rx="12" fill="#1c1408" stroke="#f59e0b" stroke-width="2"/>
      <text x="916" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">Inbox rule "."</text>
      <text x="916" y="226" text-anchor="middle" font-size="13" fill="#fcd34d">hide + forward · 09:26</text></g>
    <g class="n n5"><rect x="1008" y="170" width="152" height="80" rx="12" fill="#2a1206" stroke="#fb923c" stroke-width="2.5"/>
      <text x="1084" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#fed7aa">BEC to Treasury</text>
      <text x="1084" y="226" text-anchor="middle" font-size="13" fill="#fdba74">new bank details · 10:02</text></g>
  </g>

  <!-- lane B nodes -->
  <g class="sans">
    <g class="n n1"><rect x="336" y="380" width="152" height="80" rx="12" fill="#2a0a14" stroke="#fb7185" stroke-width="2"/>
      <text x="412" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3">Link clicked</text>
      <text x="412" y="436" text-anchor="middle" font-size="13" fill="#fda4af">Safe Links allowed · 09:31</text></g>
    <g class="n n2"><rect x="504" y="380" width="152" height="80" rx="12" fill="#2a0a14" stroke="#fb7185" stroke-width="2"/>
      <text x="580" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3">ZIP → INV-88412.js</text>
      <text x="580" y="436" text-anchor="middle" font-size="13" fill="#fda4af">wscript.exe · 09:33</text></g>
    <g class="n n3"><rect x="672" y="380" width="152" height="80" rx="12" fill="#2a0a14" stroke="#fb7185" stroke-width="2"/>
      <text x="748" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3">PowerShell -enc</text>
      <text x="748" y="436" text-anchor="middle" font-size="13" fill="#fda4af">pulls WinUpdate.dll</text></g>
    <g class="n n4"><rect x="840" y="380" width="152" height="80" rx="12" fill="#2a0a14" stroke="#fb7185" stroke-width="2"/>
      <text x="916" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3">Scheduled task</text>
      <text x="916" y="436" text-anchor="middle" font-size="13" fill="#fda4af">OneDriveSyncHelper</text></g>
    <g class="n n5"><rect x="1008" y="380" width="152" height="80" rx="12" fill="#3b0a17" stroke="#f43f5e" stroke-width="2.5"/>
      <text x="1084" y="413" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3">C2 beacon</text>
      <text x="1084" y="436" text-anchor="middle" font-size="13" fill="#fda4af">every ~5 min, 443</text></g>
  </g>

  <!-- packets -->
  <circle class="dot" r="6" fill="#fbbf24"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#laneA" xlink:href="#laneA"/></animateMotion></circle>
  <circle class="dot" r="6" fill="#fb7185"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite"><mpath href="#laneB" xlink:href="#laneB"/></animateMotion></circle>

  <!-- contain -->
  <text x="48" y="560" class="sans" font-size="14" font-weight="700" letter-spacing="2" fill="#86efac">CONTAIN</text>
  <g class="sans" font-size="15">
    <rect x="150" y="538" width="320" height="38" rx="19" fill="#0d2418" stroke="#4ade80"/>
    <text x="310" y="563" text-anchor="middle" fill="#bbf7d0">Account · priya.nair (session + rule)</text>
    <rect x="486" y="538" width="300" height="38" rx="19" fill="#0d2418" stroke="#4ade80"/>
    <text x="636" y="563" text-anchor="middle" fill="#bbf7d0">Endpoint · FIN-LT-017 (live C2)</text>
    <rect x="802" y="538" width="350" height="38" rx="19" fill="#0d2418" stroke="#4ade80"/>
    <text x="977" y="563" text-anchor="middle" fill="#bbf7d0">Money · hold the bank-detail change</text>
  </g>
  <text x="600" y="624" text-anchor="middle" class="sans" font-size="15" fill="#94a3b8">Practice case on a fictional tenant (contoso.com). Domains defanged, IPs from documentation ranges.</text>
</svg>
