<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three ways an AI coding agent ends up in an incident. One: hijacked on the endpoint, where a poisoned MCP server, a malicious package or a prompt injection drives the developer's own agent, as in s1ngularity. Two: the operator's agent, where the attacker runs an agent on their own box and pushes it into your network over VPN or SOCKS, as with Aur0ra and the Gentlemen affiliate. Three: an over-permissioned agent run by your own developer in bypass mode that deletes or leaks something. In cases one and three the evidence is on your endpoint; in case two most of it is on the attacker's side.">
  <title>Three ways an agent ends up in your case</title>
  <defs>
    <pattern id="g1" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <style>
    .s { font-family: "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif; }
    .m { font-family: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-variant-ligatures: none; white-space: pre; }
    .card { animation: rise .9s ease-out both; }
    .c2 { animation-delay: .25s; } .c3 { animation-delay: .5s; }
    @keyframes rise { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .blink { animation: blink 1.4s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="600" rx="22" fill="#0b1220"/>
  <rect width="1200" height="600" rx="22" fill="url(#g1)" opacity=".55"/>
  <text x="48" y="58" class="s" font-size="15" font-weight="700" letter-spacing="3" fill="#60a5fa">WHERE THE AGENT FITS IN THE CASE</text>
  <text x="48" y="96" class="s" font-size="30" font-weight="700" fill="#f8fafc">Three ways an AI coding agent lands in your incident</text>

  <!-- 1. hijacked -->
  <g class="card">
    <rect x="48" y="132" width="352" height="420" rx="18" fill="#0f1b33" stroke="#fb7185" stroke-width="2"/>
    <text x="72" y="170" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#fb7185">1 · HIJACKED ON THE ENDPOINT</text>
    <text x="72" y="200" class="s" font-size="19" font-weight="700" fill="#f8fafc">Your agent, their instructions</text>
    <rect x="72" y="224" width="140" height="34" rx="8" fill="#1a1630" stroke="#fb7185" stroke-opacity=".6"/>
    <text x="142" y="246" class="s" font-size="13" text-anchor="middle" fill="#fecdd3">poisoned MCP tool</text>
    <rect x="72" y="266" width="140" height="34" rx="8" fill="#1a1630" stroke="#fb7185" stroke-opacity=".6"/>
    <text x="142" y="288" class="s" font-size="13" text-anchor="middle" fill="#fecdd3">npm postinstall</text>
    <rect x="72" y="308" width="140" height="34" rx="8" fill="#1a1630" stroke="#fb7185" stroke-opacity=".6"/>
    <text x="142" y="330" class="s" font-size="13" text-anchor="middle" fill="#fecdd3">rules-file injection</text>
    <path class="flow" d="M214 283 H262" stroke="#fb7185" stroke-width="2.5" fill="none" marker-end="url(#m1)"/>
    <rect x="266" y="252" width="110" height="62" rx="12" fill="#13305e" stroke="#60a5fa" stroke-width="2"/>
    <text x="321" y="279" class="s" font-size="14" font-weight="700" text-anchor="middle" fill="#bfdbfe">local agent</text>
    <text x="321" y="299" class="m" font-size="11" text-anchor="middle" fill="#93c5fd">--yolo</text>
    <text x="72" y="386" class="s" font-size="14" fill="#cbd5e1">e.g. s1ngularity (Aug 2025) ran</text>
    <text x="72" y="406" class="s" font-size="14" fill="#cbd5e1">installed agents with approvals off</text>
    <text x="72" y="426" class="s" font-size="14" fill="#cbd5e1">to hunt for wallets and secrets.</text>
    <rect x="72" y="470" width="304" height="58" rx="12" fill="#0b2a22" stroke="#34d399" stroke-opacity=".7"/>
    <text x="88" y="494" class="s" font-size="12" font-weight="700" letter-spacing="1.5" fill="#34d399">EVIDENCE</text>
    <text x="88" y="514" class="s" font-size="14" fill="#d1fae5">on your endpoint: transcripts, configs</text>
  </g>

  <!-- 2. operator's agent -->
  <g class="card c2">
    <rect x="424" y="132" width="352" height="420" rx="18" fill="#0f1b33" stroke="#f59e0b" stroke-width="2"/>
    <text x="448" y="170" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#f59e0b">2 · THE OPERATOR'S AGENT</text>
    <text x="448" y="200" class="s" font-size="19" font-weight="700" fill="#f8fafc">Their agent, your network</text>
    <rect x="448" y="236" width="118" height="70" rx="12" fill="#2a1f0b" stroke="#f59e0b" stroke-width="2"/>
    <text x="507" y="266" class="s" font-size="13" font-weight="700" text-anchor="middle" fill="#fde68a">attacker box</text>
    <text x="507" y="286" class="m" font-size="11" text-anchor="middle" fill="#fcd34d">agent + MCP</text>
    <path class="flow" d="M568 271 H646" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#m1)"/>
    <text x="607" y="262" class="m" font-size="11" text-anchor="middle" fill="#94a3b8">SOCKS</text>
    <rect x="650" y="236" width="102" height="70" rx="12" fill="#13305e" stroke="#60a5fa" stroke-width="2"/>
    <text x="701" y="266" class="s" font-size="13" font-weight="700" text-anchor="middle" fill="#bfdbfe">your AD</text>
    <text x="701" y="286" class="m" font-size="11" text-anchor="middle" fill="#93c5fd">NAS · backups</text>
    <text x="448" y="386" class="s" font-size="14" fill="#cbd5e1">e.g. Aur0ra operators (Sophos, Oct 2026)</text>
    <text x="448" y="406" class="s" font-size="14" fill="#cbd5e1">let agents run AD discovery, Kerberoasting</text>
    <text x="448" y="426" class="s" font-size="14" fill="#cbd5e1">and the hunt for backups.</text>
    <rect x="448" y="470" width="304" height="58" rx="12" fill="#1f1a10" stroke="#f59e0b" stroke-opacity=".7"/>
    <text x="464" y="494" class="s" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f59e0b">EVIDENCE</text>
    <text x="464" y="514" class="s" font-size="14" fill="#fde68a">mostly theirs; you see machine tempo</text>
  </g>

  <!-- 3. over-permissioned -->
  <g class="card c3">
    <rect x="800" y="132" width="352" height="420" rx="18" fill="#0f1b33" stroke="#60a5fa" stroke-width="2"/>
    <text x="824" y="170" class="s" font-size="13" font-weight="700" letter-spacing="2" fill="#60a5fa">3 · OVER-PERMISSIONED</text>
    <text x="824" y="200" class="s" font-size="19" font-weight="700" fill="#f8fafc">Your developer, bypass mode</text>
    <rect x="824" y="230" width="304" height="86" rx="12" fill="#070d19" stroke="#22304d"/>
    <text x="840" y="256" class="m" font-size="12.5" fill="#94a3b8">$ claude --permission-mode \</text>
    <text x="840" y="276" class="m" font-size="12.5" fill="#94a3b8">    bypassPermissions</text>
    <text x="840" y="300" class="m" font-size="12.5" fill="#fb7185">rm -rf ./data/prod</text>
    <rect class="blink" x="996" y="290" width="8" height="14" fill="#fb7185"/>
    <text x="824" y="386" class="s" font-size="14" fill="#cbd5e1">The question HR, legal and the</text>
    <text x="824" y="406" class="s" font-size="14" fill="#cbd5e1">developer all ask: did the agent</text>
    <text x="824" y="426" class="s" font-size="14" fill="#cbd5e1">do it, or did the human?</text>
    <rect x="824" y="470" width="304" height="58" rx="12" fill="#0b2a22" stroke="#34d399" stroke-opacity=".7"/>
    <text x="840" y="494" class="s" font-size="12" font-weight="700" letter-spacing="1.5" fill="#34d399">EVIDENCE</text>
    <text x="840" y="514" class="s" font-size="14" fill="#d1fae5">on your endpoint: transcripts, configs</text>
  </g>
</svg>
