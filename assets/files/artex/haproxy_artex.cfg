# ARTEX controls for HAProxy 2.4+
# ARTEX Hunting Pack - Sujay Adkesar - https://thelocalh0st.com - MIT licence
# Merge into the frontend that serves your public hostnames.

frontend fe_public
    bind :443 ssl crt /etc/haproxy/certs/
    mode http

    # One table for every hostname this frontend serves, so the count is per client across all
    # of them. Bitrise's attacker spread 36,698 requests over 20+ hostnames.
    stick-table type ip size 1m expire 1h store http_req_rate(10s),http_err_rate(5m),gpc0
    http-request track-sc0 src

    # strings from the ARTEX code and from published intrusions
    acl artex_ua   req.hdr(user-agent) -m reg -i 'artex-enrich/|spa-api-recon|artex-selfupdate|^norma/[0-9]|reconprobe/|artexverify|\(artex\)'
    acl artex_ua   req.hdr(user-agent) -m reg -i '(probe|pentest|artx|artex)[-_]?i[0-9]{3,6}'
    acl artex_path path -m reg -i '^/zz|/artex-|zzartx|/artx_s[0-9]+\.php|artx-nonexist|_probe_missing'
    acl artex_path url  -m reg '^/nr\?zz'
    acl artex_path query -m sub 'k=x9f3c2b7e'
    acl forged     query -m sub 'eyJhbGciOiJub25lI' 'state=notvalid' '169.254.169.254'

    # behaviour: 4xx bursts (fuzzing) and raw volume, counted across every hostname
    acl fuzzing    sc_http_err_rate(0) gt 40
    acl flooding   sc_http_req_rate(0) gt 100

    # self-declared testers you did not hire
    acl labelled   req.hdr(user-agent) -m reg -i 'pentest|authori[sz]ed[- ]|\(authori[sz]ed|read-?only|security-research|bounty'
    acl approved   src -f /etc/haproxy/approved_testers.lst

    http-request deny deny_status 403 if artex_ua or artex_path or forged
    http-request deny deny_status 429 if fuzzing or flooding
    http-request set-header X-Artex-Label 1 if labelled !approved
    http-request capture req.hdr(user-agent) len 200

    # never pass a client-supplied client-IP header to the application
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    option forwardfor

    default_backend be_app
