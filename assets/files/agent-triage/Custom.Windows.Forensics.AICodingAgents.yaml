  - name: ClaudeTranscriptGlob
    default: C:/Users/*/.claude/projects/**/*.jsonl
  - name: CodexRolloutGlob
    default: C:/Users/*/.codex/sessions/**/*.jsonl
  - name: MaxSizeBytes
    type: int
    default: 1073741824
  - name: UploadFiles
    type: bool
    default: Y
sources:
  - name: Files
    query: |
      SELECT * FROM foreach(row=GlobTable, query={
          SELECT Agent, Category, OSPath, Size, Mtime, Btime,
                 hash(path=OSPath).SHA256 AS SHA256,
                 if(condition=UploadFiles, then=upload(file=OSPath)) AS Upload
          FROM glob(globs=Glob)
          WHERE NOT IsDir AND Size < MaxSizeBytes
      })
  - name: McpAndHookConfigs
    query: |
      SELECT OSPath, Mtime, read_file(filename=OSPath, length=1048576) AS Content
      FROM glob(globs=ConfigGlobTable.Glob)
      WHERE NOT IsDir
  - name: ClaudeCodeToolCalls
    query: |
      SELECT * FROM foreach(row={ SELECT OSPath FROM glob(globs=ClaudeTranscriptGlob) },
        query={
          SELECT timestamp AS Timestamp, sessionId AS SessionId, cwd AS Cwd,
                 isSidechain AS Subagent, message.content AS Content, OSPath AS Transcript
          FROM parse_jsonl(filename=OSPath)
          WHERE type = 'assistant' AND format(format='%v', args=message.content) =~ 'tool_use'
        })
  - name: CodexShellCommands
    query: |
      SELECT * FROM foreach(row={ SELECT OSPath FROM glob(globs=CodexRolloutGlob) },
        query={
          SELECT timestamp AS Timestamp, payload.command AS Command, payload.cwd AS Cwd,
                 payload.exit_code AS ExitCode, OSPath AS Rollout
          FROM parse_jsonl(filename=OSPath)
          WHERE type = 'event_msg' AND payload.type = 'exec_command_end'
        })
