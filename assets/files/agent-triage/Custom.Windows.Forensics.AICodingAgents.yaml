name: Custom.Windows.Forensics.AICodingAgents
author: Sujay Adkesar (thelocalh0st.com)
description: |
  Collects what AI coding agents leave on an endpoint: transcripts, MCP server
  definitions, hooks, rules files, state databases and logs, with SHA256 per file.
  Extra sources pull the tool calls straight out of Claude Code and Codex transcripts.
  Generated 2026-10-31 by the Agent Triage Kit for: Claude Code, OpenAI Codex, Cursor, GitHub Copilot CLI, VS Code Copilot Chat, Gemini CLI, Antigravity, Windsurf, Cline.
  Analyze the collection offline with agent_triage_analyze.py from https://thelocalh0st.com/posts/ai-coding-agent-forensics/
type: CLIENT
precondition: SELECT OS FROM info() WHERE OS = 'windows'
