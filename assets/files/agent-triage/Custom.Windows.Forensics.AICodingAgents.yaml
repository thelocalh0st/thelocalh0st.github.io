  - name: ConfigGlobTable
    type: csv
    default: |
      Glob
      C:/Users/*/.claude/settings.json
      C:/Users/*/.claude/settings.local.json
      C:/Users/*/.claude.json
      C:/Users/*/AppData/Roaming/Claude/claude_desktop_config.json
      C:/Users/*/AppData/Local/Packages/Claude_*/LocalCache/Roaming/Claude*/claude_desktop_config.json
      C:/Program Files/ClaudeCode/managed-settings.json
      C:/Program Files/ClaudeCode/managed-mcp.json
