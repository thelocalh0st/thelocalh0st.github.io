<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LastWrite — Windows Forensics Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1116; --ink-2:#11151C; --panel:#171C25; --panel-2:#1D2430; --panel-3:#262F3E;
  --line:#2F394B; --line-soft:#222A37; --term:#090C11;
  --text:#E8ECF4; --text-2:#B3BCCC; --muted:#7A859A;
  --acc:#93A8FF; --acc-2:#BAC7FF; --acc-ink:#0B1233; --acc-wash:rgba(147,168,255,.13);
  --warn:#F2B33D; --warn-2:#FFD27A; --warn-wash:rgba(242,179,61,.12);
  --cyan:#5CC8FF; --cyan-wash:rgba(92,200,255,.12);
  --green:#45CC8A; --green-wash:rgba(69,204,138,.13);
  --red:#FF6B6B; --red-wash:rgba(255,107,107,.13);
  --violet:#C79BFF; --violet-wash:rgba(199,155,255,.13); --pink:#FF8FC7;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --side:236px; --tasks:340px; --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
::selection{background:rgba(147,168,255,.35)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3,h4{font-family:var(--cond);margin:0;letter-spacing:.01em}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#323C50;border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ───────── frame ───────── */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100vh;transition:grid-template-columns .25s}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line-soft);background:var(--ink-2);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:calc(var(--side) - 36px)}
.brand svg{flex:none}
.brand b{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px;display:block;line-height:1}
.casechip{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.casechip i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-wash);display:inline-block}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:10px;min-width:210px}
.xp .bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-2));border-radius:99px;transition:width .5s}
.xp .num{font-family:var(--mono);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.tbtn:hover{border-color:#44527A;background:var(--panel-2)}
.tbtn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:11.5px;display:inline-grid;place-items:center}

.side{border-right:1px solid var(--line-soft);background:var(--ink-2);overflow:auto;padding:16px 12px 24px}
.side h4{font-size:12.5px;color:var(--muted);font-family:var(--sans);font-weight:500;margin:4px 8px 10px;display:flex;align-items:center;justify-content:space-between}
.side h4 button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--text-2);cursor:pointer;font-size:13px}
.route{list-style:none;margin:0;padding:0;position:relative}
.route:before{content:"";position:absolute;left:21px;top:18px;bottom:18px;width:2px;background:var(--line-soft)}
.route button{width:100%;display:flex;align-items:center;gap:12px;padding:7px 8px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left;color:var(--text-2)}
.route button:hover{background:var(--panel)}
.route button.on{background:var(--panel-2);color:var(--text)}
.route .dot{position:relative;z-index:1;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);border:2px solid var(--line);font:600 12px var(--mono);color:var(--muted)}
.route button.on .dot{border-color:var(--acc);color:var(--acc)}
.route .done .dot{background:var(--green);border-color:var(--green);color:#06231a}
.route .lbl{flex:1;min-width:0}
.route .lbl b{display:block;font-weight:500;font-size:13.5px;line-height:1.25}
.route .lbl small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.side .foot{margin:22px 8px 0;padding-top:14px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:12px}
.side .foot button{background:none;border:0;color:var(--text-2);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.app.compact{grid-template-columns:76px minmax(0,1fr)}
.app.compact .side .lbl,.app.compact .side h4 span,.app.compact .side .foot{display:none}
.app.compact .side h4{justify-content:center}
.app.compact .route button{justify-content:center;padding:7px 0}
.app.compact .route:before{left:50%;margin-left:-1px}

.main{overflow:auto;position:relative}
.stage{padding:26px 30px 60px;max-width:1520px;margin:0 auto}
.shead{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.shead .ttl{display:flex;align-items:center;gap:12px}
.shead .n{font:600 13px var(--mono);color:var(--acc);border:1px solid rgba(147,168,255,.45);border-radius:6px;padding:2px 8px}
.shead h1{font-size:30px;font-weight:600;line-height:1.1}
.shead p{margin:6px 0 0;color:var(--text-2);max-width:74ch}
.shead .grow{flex:1;min-width:260px}

.lab{display:grid;grid-template-columns:minmax(0,1fr) var(--tasks);gap:20px;align-items:start}
.lab.notasks{grid-template-columns:minmax(0,1fr)}
.ws{min-width:0;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.panel>.ph h3{font-size:16px;font-weight:600}
.panel>.ph .sub{color:var(--muted);font-size:12.5px}
.panel>.pb,.pb{padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2>*,.grid3>*{min-width:0}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#4A5A82}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.pri:hover{background:var(--acc-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.danger{border-color:rgba(255,107,107,.5);color:#FFB3B3;background:var(--red-wash)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
.seg{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--text-2);font-size:12.5px;font-weight:500}
.seg button.on{background:var(--panel-3);color:var(--text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);padding:0 10px;overflow:auto;align-items:center}
.tabs button{border:0;background:transparent;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.chip.pass{color:var(--green);border-color:rgba(69,204,138,.45);background:var(--green-wash)}
.chip.fail{color:var(--red);border-color:rgba(255,107,107,.45);background:var(--red-wash)}
.chip.warn{color:var(--warn);border-color:rgba(242,179,61,.45);background:var(--warn-wash)}
.chip.info{color:var(--cyan);border-color:rgba(92,200,255,.4);background:var(--cyan-wash)}
.chip.vio{color:var(--violet);border-color:rgba(199,155,255,.4);background:var(--violet-wash)}
.banner{display:flex;gap:12px;padding:12px 14px;border-radius:10px;font-size:13.5px;align-items:flex-start}
.banner.ok{background:var(--green-wash);border:1px solid rgba(69,204,138,.45)}
.banner.warn{background:var(--warn-wash);border:1px solid rgba(242,179,61,.45)}
.banner.bad{background:var(--red-wash);border:1px solid rgba(255,107,107,.45)}
.banner.info{background:var(--cyan-wash);border:1px solid rgba(92,200,255,.35)}
.banner b{display:block}
.flagi{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line-soft);font-size:13px}
.flagi .sev{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.flagi .sev.h{background:var(--red)} .flagi .sev.m{background:var(--warn)} .flagi .sev.l{background:var(--cyan)}
.flagi b{font-weight:600} .flagi small{display:block;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}
.raw{font:12.5px/1.6 var(--mono);background:var(--term);border:1px solid var(--line-soft);border-radius:10px;overflow:auto;white-space:pre;color:#CFD7E6;padding:12px}

/* tasks */
.tasks{position:sticky;top:0;display:flex;flex-direction:column;gap:10px}
.tasks .tp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 4px}
.tasks .tp-head h3{font-size:16px}
.tasks .tp-head span{font:500 12px var(--mono);color:var(--muted)}
.task{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;position:relative}
.task.done{border-color:rgba(69,204,138,.35);background:linear-gradient(180deg,rgba(69,204,138,.07),transparent 70%),var(--panel)}
.task .tq{display:flex;gap:10px}
.task .tq .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--mono);background:var(--panel-3);color:var(--text-2);margin-top:1px}
.task.done .tq .k{background:var(--green);color:#06231a}
.task .tq p{margin:0;font-size:13.5px;line-height:1.45;padding-right:44px}
.task .pts{position:absolute;right:12px;top:10px;font:500 11px var(--mono);color:var(--muted)}
.task .ta{margin-top:10px;display:flex;gap:6px}
.task .ta .inp{height:34px;padding:6px 10px;font-family:var(--mono);font-size:12.5px}
.task .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.task .choices button{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:13px;line-height:1.35}
.task .choices button:hover{border-color:#4A5A82}
.task .choices button.bad{border-color:rgba(255,107,107,.6);color:#FFB8B8}
.task .choices button.good{border-color:var(--green);color:var(--green)}
.task .fb{font-size:12.5px;margin-top:8px;color:var(--red)}
.task .ex{font-size:12.5px;margin-top:8px;color:var(--text-2);border-left:2px solid var(--green);padding-left:10px}
.task .ex b{color:var(--green);font-weight:600;word-break:break-all}
.task .hint{margin-top:8px;font-size:12.5px;color:var(--acc-2);background:var(--acc-wash);border-radius:8px;padding:8px 10px}
.task .hintbtn{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline}
.task .hintbtn:hover{color:var(--acc)}
.task .auto{margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.task.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.nextbar{margin-top:6px;display:flex;justify-content:flex-end}

/* evidence locker / drawers */
.tent{flex:none;width:26px;height:22px;display:grid;place-items:end center;padding-bottom:2px;font:700 11px var(--mono);color:var(--acc-ink);background:var(--acc);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:min(460px,100vw);background:var(--ink-2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s ease;z-index:20;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.drawer .dh h3{font-size:18px;flex:1}
.drawer .db{flex:1;overflow:auto;padding:14px 16px}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.ioc{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.ioc .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.ioc .meta{font-size:11.5px;color:var(--muted)}
.ioc .ty{font-size:10.5px;font-weight:600;color:var(--cyan);border:1px solid rgba(92,200,255,.35);border-radius:4px;padding:0 5px;margin-right:6px}
.ioc .acts{margin-left:auto;display:flex;gap:4px}
.ioc .acts button{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer;color:var(--text-2)}
.tb-ops{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tb-ops button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--text-2)}
.tb-ops button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-wash)}
.tb-out{margin-top:10px;background:var(--term);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;min-height:90px;max-height:330px;overflow:auto}
.tb-label{font-size:12px;color:var(--muted);margin:10px 0 4px;display:flex;justify-content:space-between}
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:40;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#0A0D13;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:13.5px;animation:tin .25s ease}
.toast.ok{border-color:rgba(69,204,138,.5)} .toast.ev{border-color:rgba(147,168,255,.6)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.65);display:none;place-items:center;z-index:50;padding:16px}
.modal-bg.open{display:grid}
.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal .mh{padding:16px 18px 6px;display:flex;gap:10px;align-items:center}
.modal .mh h3{font-size:18px;flex:1}
.modal .mb{padding:6px 18px 16px;color:var(--text-2)}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}

/* data grid */
.grid{overflow:auto;max-height:440px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font:12px/1.45 var(--mono)}
table.dt th{position:sticky;top:0;background:var(--panel-2);color:var(--text-2);text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;max-width:440px;overflow:hidden;text-overflow:ellipsis;color:#D3DAE8}
table.dt tr.sel td{background:var(--acc-wash)}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover td{background:rgba(147,168,255,.06)}
table.dt td.hit,.hit{color:var(--warn)}
table.dt td.bad{color:var(--red)}
table.dt td.num{text-align:right}
.filt{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.filt .inp{height:32px;padding:4px 10px;font-size:12.5px;font-family:var(--mono)}

/* ───────── brief ───────── */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.alert{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden}
.alert .bandr{height:4px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#6e2a33 12px 24px)}
.alert .ah{padding:16px 20px 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert .ah h2{font-size:22px;flex:1;min-width:240px}
.alert .al{padding:4px 20px 18px;display:grid;gap:8px}
.aline{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--ink)}
.aline time{font:600 12.5px var(--mono);color:var(--text-2)}
.aline b{font-weight:500;font-size:13.5px}
.aline small{display:block;color:var(--muted);font-size:12px}
.bag{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.bag:before{content:"";position:absolute;left:0;right:0;top:0;height:28px;background:repeating-linear-gradient(90deg,var(--acc) 0 22px,transparent 22px 30px);opacity:.14}
.bag h3{font-size:17px;margin:14px 0 10px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--acc-wash);color:var(--acc);font:700 11px var(--mono)}
.item b{font-weight:500;font-size:13.5px;display:block}
.item small{display:block;color:var(--muted);font-size:12px}
.item code{font-size:11px;color:var(--text-2);word-break:break-all}
.relay{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));padding:18px 6px 6px}
.relay:before{content:"";position:absolute;left:5%;right:5%;top:37px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.relay .hop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;background:none;border:0;padding:0 3px;color:var(--text-2)}
.relay .hop .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);position:relative;z-index:1;font:600 13px var(--mono)}
.relay .hop:hover .c{border-color:var(--acc);color:var(--acc)}
.relay .hop.done .c{background:var(--green);border-color:var(--green);color:#06231a}
.relay .hop b{font-size:12.5px;font-weight:500;line-height:1.25}
.relay .hop small{font:11px var(--mono);color:var(--muted)}

/* ───────── primer ───────── */
.amap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.acard{border:1px solid var(--line-soft);background:var(--ink);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.acard:hover{border-color:#44527A}

.acard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.acard .tags span{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--panel-3);color:var(--text-2)}
.adetail{border:1px solid var(--line-soft);border-radius:12px;padding:16px;background:var(--ink)}
.adetail h3{font-size:20px;margin-bottom:6px}
.adetail .loc{font:12.5px var(--mono);color:var(--acc-2);word-break:break-all;margin:6px 0 10px}
.adetail ul{margin:6px 0 0;padding-left:18px;color:var(--text-2);font-size:13.5px}
.vol{display:grid;gap:6px}
.vol li{list-style:none}
.volrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--ink)}
.volrow .grip{color:var(--muted);cursor:grab;user-select:none}
.volrow span.t{flex:1;font-size:13.5px}
.volrow button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--text-2)}
.volrow.ok{border-color:rgba(69,204,138,.55)} .volrow.no{border-color:rgba(255,107,107,.55)}
.ftconv{display:grid;gap:10px}
.ftconv .out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ftconv .out div{background:var(--ink);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px}
.ftconv .out small{display:block;color:var(--muted);font-size:11.5px}
.ftconv .out b{font:500 13px var(--mono);word-break:break-all}

/* ───────── hex viewer ───────── */
.hex{font:12px/1.75 var(--mono);background:var(--term);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;overflow:auto;white-space:nowrap}
.hex .r{display:flex;gap:14px}
.hex .o{color:#56627A;user-select:none}
.hex .h{display:flex;gap:0}
.hex .h i,.hex .a i{font-style:normal;display:inline-block;text-align:center;border-radius:3px}
.hex .h i{width:2.4ch}
.hex .h i:nth-child(8){margin-right:.8ch}
.hex .a{color:#9AA5BA}
.hex .a i{width:1ch}
.hex i.f{cursor:help}
.hex i.f0{background:rgba(147,168,255,.22)} .hex i.f1{background:rgba(69,204,138,.22)} .hex i.f2{background:rgba(242,179,61,.24)}
.hex i.f3{background:rgba(255,143,199,.22)} .hex i.f4{background:rgba(92,200,255,.22)} .hex i.f5{background:rgba(199,155,255,.22)}
.hex i.hot{outline:1px solid var(--text);background:rgba(255,255,255,.18)}
.legend{display:grid;gap:6px;margin-top:12px}
.legend div{display:grid;grid-template-columns:14px 120px 90px minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:7px;cursor:help}
.legend div:hover,.legend div.hot{background:var(--panel-2)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.legend i.f0{background:rgba(147,168,255,.75)} .legend i.f1{background:rgba(69,204,138,.75)} .legend i.f2{background:rgba(242,179,61,.8)} .legend i.f3{background:rgba(255,143,199,.75)} .legend i.f4{background:rgba(92,200,255,.75)} .legend i.f5{background:rgba(199,155,255,.75)}
.legend code{color:var(--text-2);font-size:11.5px}
.legend span.v{font-family:var(--mono);color:var(--acc-2);word-break:break-all}

/* ───────── registry ───────── */
.reg{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:560px}
#rvals td:first-child{max-width:300px}
#rvals td:last-child{max-width:340px}
.rtree{border-right:1px solid var(--line-soft);padding:8px 6px;overflow:auto;max-height:640px;font:12.5px var(--mono)}
.rtree .n{display:flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;color:var(--text-2)}
.rtree .n:hover{background:var(--panel-2)}
.rtree .n.on{background:var(--acc-wash);color:var(--acc-2)}
.rtree .n .tw{width:14px;flex:none;color:var(--muted);text-align:center}
.rtree .n .ico{width:12px;height:10px;border:1.5px solid #C9A94A;border-radius:2px;flex:none;background:rgba(201,169,74,.18)}
.rtree .n.hive .ico{border-color:var(--acc);background:var(--acc-wash);border-radius:50%;width:11px;height:11px}
.rtree .n.bm{color:var(--warn)}
.rpane{display:flex;flex-direction:column;min-width:0}
.rpath{padding:9px 14px;border-bottom:1px solid var(--line-soft);font:12px var(--mono);color:var(--text-2);word-break:break-all;display:flex;gap:10px;align-items:center}
.rpath .lw{margin-left:auto;white-space:nowrap;color:var(--muted)}
.rdec{border-top:1px solid var(--line-soft);padding:14px;min-height:150px}
.rdec h4{font-size:15px;margin-bottom:8px}
.bm{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.bm button{border:1px dashed var(--line);background:transparent;color:var(--text-2);font:11.5px var(--mono);border-radius:6px;padding:3px 8px;cursor:pointer}
.bm button:hover{border-color:var(--acc);color:var(--acc)}

/* ───────── PECmd-style text ───────── */
.side2{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:520px}
.flist{border-right:1px solid var(--line-soft);overflow:auto;max-height:620px;padding:6px}
.flist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--text-2);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist button small{display:block;color:var(--muted);font-size:11px}
.flist button:hover{background:var(--panel-2)}
.flist button.on{background:var(--acc-wash);color:var(--acc-2)}
.fview{padding:14px;min-width:0}
.fview .raw{max-height:560px;white-space:pre-wrap;word-break:break-all}
.bars{display:grid;gap:6px}
.bars .b{display:grid;grid-template-columns:180px minmax(0,1fr) 110px;gap:10px;align-items:center;font:12px var(--mono)}
.bars .b .tr{height:12px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.bars .b .tr i{display:block;height:100%;background:var(--cyan);border-radius:99px}
.bars .b.hot .tr i{background:var(--red)}
.bars .b span:last-child{text-align:right;color:var(--text-2)}
.si-fn{display:grid;grid-template-columns:110px repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;font:12px var(--mono)}
.si-fn>div{background:var(--ink);padding:7px 10px}
.si-fn .h{background:var(--panel-2);color:var(--text-2);font-family:var(--sans);font-weight:600}
.si-fn .d{color:var(--warn)}

/* ───────── event viewer ───────── */
.evx{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:640px}
.logs{border-right:1px solid var(--line-soft);padding:8px 6px}
.logs button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13px;gap:8px}
.logs button span{font:11.5px var(--mono);color:var(--muted)}
.logs button:hover{background:var(--panel-2)}
.logs button.on{background:var(--acc-wash);color:var(--text)}
.logs .grp{font-size:11.5px;color:var(--muted);padding:10px 10px 4px}
.evp{display:flex;flex-direction:column;min-width:0}
.evp .grid{max-height:300px}
.evd{border-top:1px solid var(--line-soft);padding:12px 14px;min-height:260px}
.evd .dh{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.evd .dh b{font-family:var(--cond);font-size:17px}
.evd .raw{max-height:330px;white-space:pre-wrap;word-break:break-all}
.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--cyan)}
.lvl.w{background:var(--warn)} .lvl.e{background:var(--red)} .lvl.v{background:var(--muted)}
.xml .tg{color:var(--cyan)} .xml .at{color:var(--violet)} .xml .av{color:#9BE39B} .xml .tx{color:#E8ECF4}

/* ───────── terminal ───────── */
.term{background:var(--term);border:1px solid #1F2635;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;height:620px}
.term .th{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0F131B;border-bottom:1px solid #1F2635;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.term .th .qk{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.term .th .qk button{border:1px solid #273044;background:transparent;color:var(--text-2);font:11px var(--mono);border-radius:5px;padding:2px 7px;cursor:pointer}
.term .th .qk button:hover{border-color:var(--acc);color:var(--acc)}
.term .out{flex:1;overflow:auto;padding:12px 14px;font:12.5px/1.5 var(--mono);color:#D7DEE9}
.term .out div{white-space:pre}
.term .out .c{color:var(--acc-2)} .term .out .e{color:#FF9A9A;white-space:pre-wrap} .term .out .d{color:#7F8BA3;white-space:pre-wrap} .term .out .g{color:#7CF0B4;white-space:pre-wrap}
.term .out .w{color:var(--warn)}
.term .inrow{display:flex;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid #1F2635;font:12.5px var(--mono);color:var(--acc-2)}
.term .inrow input{flex:1;background:transparent;border:0;outline:none;color:#FFF;font:12.5px var(--mono)}

/* ───────── timeline ───────── */
.tl td.tag{width:6px;padding:0!important}
.tl tr.mal td.tag{background:var(--red)} .tl tr.ir td.tag{background:var(--cyan)} .tl tr.usb td.tag{background:var(--violet)} .tl tr.ben td.tag{background:var(--panel-3)}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.srcs button{border:1px solid var(--line);background:var(--ink);color:var(--text-2);font:11.5px var(--mono);border-radius:99px;padding:3px 10px;cursor:pointer}
.srcs button.on{border-color:var(--acc);color:var(--acc);background:var(--acc-wash)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ───────── YARA ───────── */
.editor{position:relative;height:300px;background:var(--term);border-bottom:1px solid var(--line-soft)}
.editor pre,.editor textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-wrap:break-word;overflow:auto;border:0;tab-size:4}
.editor textarea{background:transparent;color:transparent;caret-color:var(--acc);resize:none;outline:none}
.editor pre{color:#CFD7E6;pointer-events:none}
.k-kw{color:var(--violet)} .k-tb{color:var(--cyan)} .k-st{color:#9BE39B} .k-fn{color:var(--acc-2)} .k-op{color:var(--pink)} .k-cm{color:#5B6782;font-style:italic} .k-nu{color:#FFB38A} .k-var{color:var(--warn-2)}
.hunt{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:600px}
.schema{border-right:1px solid var(--line-soft);padding:10px 6px;overflow:auto;max-height:760px;font-size:12.5px}
.schema details{border-radius:7px}
.schema summary{cursor:pointer;padding:6px 8px;border-radius:7px;font:500 12.5px var(--mono);color:var(--text);list-style:none;display:flex;justify-content:space-between}
.schema summary::-webkit-details-marker{display:none}
.schema summary:hover{background:var(--panel-2)}
.schema summary span{color:var(--muted);font-size:11px}
.schema .cols button{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 8px 2px 22px;font:11.5px var(--mono);color:var(--text-2);cursor:pointer}
.schema .cols button:hover{color:var(--acc)}
.qpane{display:flex;flex-direction:column;min-width:0}
.qbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.qpane .editor{height:190px}
.rmeta{display:flex;gap:14px;align-items:center;padding:8px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.rmeta b{color:var(--text)}
.rmeta .err{color:var(--red);font-family:var(--mono);font-size:12px}
.qpane .grid{max-height:420px}
.qpane table.dt td{cursor:copy}
.qpane .bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:14px 12px 4px}
.qpane .bars div{flex:1;background:var(--cyan);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.qpane .bars div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10.5px var(--mono);color:var(--text-2)}
.blabels{display:flex;gap:4px;padding:0 12px 10px}
.blabels span{flex:1;font:10px var(--mono);color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.yres td .ok{color:var(--green)} .yres td .no{color:var(--red)}
.hits{display:flex;gap:4px;flex-wrap:wrap}
.hits span{font:11px var(--mono);padding:0 6px;border-radius:4px;background:var(--panel-3);color:var(--text-2)}

/* ───────── decision board ───────── */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col h4{font-size:14px;color:var(--text-2);margin:0 0 8px;font-family:var(--sans);font-weight:600}
.dcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--ink);border-radius:12px;padding:11px 12px;cursor:pointer;margin-bottom:10px;position:relative}
.dcard:hover{border-color:#4A5A82}
.dcard b{display:block;font-weight:500;font-size:13.5px;padding-right:22px;line-height:1.35}
.dcard small{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.dcard .vd{overflow-wrap:anywhere}
.dcard .ck{position:absolute;right:10px;top:10px;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.dcard.on{border-color:var(--acc);background:var(--acc-wash)}
.dcard.on .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.dcard.v-ok{border-color:rgba(69,204,138,.7)} .dcard.v-miss{border-color:rgba(242,179,61,.7);border-style:dashed} .dcard.v-harm{border-color:rgba(255,107,107,.75)}
.dcard .vd{display:block;font-size:12px;margin-top:6px}
.dcard.v-ok .vd{color:var(--green)} .dcard.v-miss .vd{color:var(--warn)} .dcard.v-harm .vd{color:var(--red)} .dcard.v-neu .vd{color:var(--muted)}

/* ───────── debrief ───────── */
.paper{background:#FAFAFB;color:#1b2130;border-radius:14px;padding:34px 40px;max-width:900px}
.paper h2{font-family:var(--cond);font-size:26px;color:#0e1320}
.paper h3{font-family:var(--cond);font-size:17px;margin:22px 0 8px;color:#0e1320;border-bottom:1px solid #e3e4ea;padding-bottom:4px}
.paper p,.paper li{font-size:13.5px;line-height:1.55}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th,.paper td{text-align:left;padding:5px 8px;border-bottom:1px solid #e9eaef;vertical-align:top}
.paper th{color:#59607a;font-weight:600}
.paper code{font-family:var(--mono);font-size:11.8px;word-break:break-all}
.paper .meta{color:#59607a;font-size:12.5px}
.paper .sevpill{display:inline-block;background:#c62828;color:#fff;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600}
.paper tr.dim td{color:#a0a5b5}
.grade{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.grade .big{font-family:var(--cond);font-size:64px;line-height:1;color:var(--acc)}

@media (max-width:1180px){:root{--tasks:300px}.hero{grid-template-columns:1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.amap{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  body{overflow:auto}
  .toasts{right:16px;left:16px;align-items:stretch}
  .app,.app.compact{display:block;height:auto}
  .top{position:sticky;top:0;flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
  .brand{min-width:0}.clock,.casechip{display:none}.xp{min-width:140px;flex:1}
  .side{position:sticky;top:56px;z-index:4;border-right:0;border-bottom:1px solid var(--line-soft);padding:8px 10px;overflow-x:auto}
  .side h4,.side .foot{display:none}
  .route{display:flex;gap:4px}.route:before{display:none}
  .route button{width:auto;padding:6px 8px}.route .lbl small{display:none}.route .lbl b{white-space:nowrap;font-size:12.5px}
  .main{overflow:visible}.stage{padding:18px 16px 60px}
  .lab{grid-template-columns:1fr}.tasks{position:static}
  .grid2,.grid3,.board,.ftconv .out{grid-template-columns:1fr}
  .amap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reg,.side2,.evx,.hunt{grid-template-columns:1fr}
  .rtree,.flist,.logs,.schema{border-right:0;border-bottom:1px solid var(--line-soft);max-height:240px;overflow:auto}
  .relay{grid-template-columns:repeat(3,1fr);row-gap:16px}.relay:before{display:none}
  .bars .b{grid-template-columns:110px minmax(0,1fr) 80px}
  .paper{padding:22px 18px}.drawer{top:0}
}
@media print{
  body{overflow:visible;background:#fff}
  .top,.side,.tasks,.shead,.no-print,.drawer,.toasts,.modal-bg,.grade{display:none!important}
  .app{display:block;height:auto}.main{overflow:visible}.stage{padding:0}
  .paper{max-width:none;border-radius:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═════════════ 09 Respond ═════════════ */
const PLAN_TASKS = { r1: s => s.iso131 && s.mem131 && !s.reboot131 && !s.delfirst, r2: s => s.blockip && s.blockdom, r3: s => s.resetR && s.resetA && s.support, r4: s => s.runkey && !s.avscan, r5: s => s.reimage && s.c127, r6: s => s.legal && s.siem };

      const vd = !ran ? '' : p.k === 'req' ? (on ? 'Required ✓' : 'Missing — required') : p.k === 'harm' && on ? '✕ ' + p.why : p.k === 'neu' && on ? 'Not yet: ' + p.why : '';
      return `<button class="dcard ${on ? 'on' : ''} ${v}" data-p="${p.id}" aria-pressed="${on}"><span class="ck">${on ? '✓' : ''}</span><b>${esc(p.t)}</b><small>${esc(p.d)}</small>${vd ? `<span class="vd">${esc(vd)}</span>` : ''}</button>`; }).join('')}</div>`).join('')}</div></div></div>`, 'respond');

}

/* ═════════════ init ═════════════ */
function init() {
  renderToolOps(); renderLocker(); hud();
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
    const c = e.target.closest('[data-copy]'); if (c) { copyText(c.dataset.copy); return; }
    const tq = e.target.closest('[data-tlq]'); if (tq) { tlQ = tq.dataset.tlq; tlMal = false; drawer('drawerEv', false); go('timeline'); return; }
    const a = e.target.closest('.task [data-act]');
    if (a) {
      const card = a.closest('.task'), t = TASK[card.dataset.id], fb = $('.fb', card);
      if (a.dataset.act === 'hint') { S.hint[t.id] = true; save(); refreshTasks(); hud(); return; }
      if (a.dataset.act === 'check') { const v = $('input', card).value; if (checkText(t, v)) complete(t.id); else { fb.hidden = false; fb.textContent = v.trim() ? 'Not quite. Check your evidence and try again.' : 'Type an answer first.'; card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } return; }
      if (a.dataset.act === 'choose') { const j = +a.dataset.j; if (j === t.correct) { a.classList.add('good'); setTimeout(() => complete(t.id), 250); } else { a.classList.add('bad'); a.disabled = true; fb.hidden = false; fb.textContent = 'Not that one.'; } return; }
    }
    const cl = e.target.closest('[data-close]'); if (cl) drawer(cl.dataset.close, false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('.task input')) { e.preventDefault(); e.target.closest('.task').querySelector('[data-act="check"]').click(); }
    if (e.key === 'Escape') { closeModal(); $$('.drawer').forEach(d => d.classList.remove('open')); }
  });
  const setSide = () => { $('#app').classList.toggle('compact', !!S.compact); $('#btnSide').textContent = S.compact ? '»' : '«'; $('#btnSide').setAttribute('aria-label', S.compact ? 'Expand route' : 'Collapse route'); };
