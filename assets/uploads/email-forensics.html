<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return-Path — Email Forensics Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1526; --ink-2:#0F1A2F; --panel:#15223B; --panel-2:#1A2A48; --panel-3:#20335A;
  --line:#273B62; --line-soft:#1D2E4E;
  --text:#E7EDF8; --text-2:#B0BDD4; --muted:#7587A8;
  --amber:#F2B33D; --amber-2:#FFD27A; --amber-ink:#2B1D03; --amber-wash:rgba(242,179,61,.12);
  --cyan:#5CC8FF; --cyan-wash:rgba(92,200,255,.12);
  --green:#45CC8A; --green-wash:rgba(69,204,138,.13);
  --red:#FF6B6B; --red-wash:rgba(255,107,107,.13);
  --violet:#B49CFF; --pink:#FF8FC7;
  --ps:#012456; --ps-2:#0A3069;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --r-lg:14px; --r:10px; --r-sm:6px;
  --side:236px; --tasks:340px; --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cyan)}
::selection{background:rgba(242,179,61,.35)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3,h4{font-family:var(--cond);margin:0;letter-spacing:.01em}
.scroll::-webkit-scrollbar,*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#2A3F68;border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

/* ───────── app frame ───────── */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:var(--top) minmax(0,1fr);height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line-soft);background:var(--ink-2);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:calc(var(--side) - 36px)}
.brand svg{flex:none}
.brand b{font-family:var(--cond);font-size:19px;font-weight:700;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px;display:block;line-height:1}
.casechip{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.casechip i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--red-wash);display:inline-block}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.xp{display:flex;align-items:center;gap:10px;min-width:210px}
.xp .bar{flex:1;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-2));border-radius:99px;transition:width .5s}
.xp .num{font-family:var(--mono);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.tbtn:hover{border-color:#3A5486;background:var(--panel-2)}
.tbtn .badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:11.5px;display:inline-grid;place-items:center}
.tbtn.ghost{background:transparent}

/* sidebar = investigation route */
.side{border-right:1px solid var(--line-soft);background:var(--ink-2);overflow:auto;padding:16px 12px 24px}
.side h4{font-size:12.5px;color:var(--muted);font-family:var(--sans);font-weight:500;margin:4px 8px 10px;display:flex;align-items:center;justify-content:space-between}
.side h4 button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--text-2);cursor:pointer;font-size:13px}
.app{transition:grid-template-columns .25s}
.app.compact{grid-template-columns:76px minmax(0,1fr)}
.app.compact .side .lbl,.app.compact .side h4 span,.app.compact .side .foot{display:none}
.app.compact .side h4{justify-content:center}
.app.compact .route button{justify-content:center;padding:8px 0}
.app.compact .route:before{left:50%;margin-left:-1px}
.route{list-style:none;margin:0;padding:0;position:relative}
.route:before{content:"";position:absolute;left:21px;top:18px;bottom:18px;width:2px;background:var(--line-soft)}
.route li{position:relative}
.route button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 8px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left;color:var(--text-2)}
.route button:hover{background:var(--panel)}
.route button.on{background:var(--panel-2);color:var(--text)}
.route .dot{position:relative;z-index:1;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink-2);border:2px solid var(--line);font:600 12px var(--mono);color:var(--muted)}
.route button.on .dot{border-color:var(--amber);color:var(--amber)}
.route .done .dot{background:var(--green);border-color:var(--green);color:#06231a}
.route .lbl{flex:1;min-width:0}
.route .lbl b{display:block;font-weight:500;font-size:13.5px;line-height:1.25}
.route .lbl small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.side .foot{margin:22px 8px 0;padding-top:14px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:12px}
.side .foot button{background:none;border:0;color:var(--text-2);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}

/* main */
.main{overflow:auto;position:relative}
.stage{padding:26px 30px 60px;max-width:1500px;margin:0 auto}
.shead{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.shead .ttl{display:flex;align-items:center;gap:12px}
.shead .n{font:600 13px var(--mono);color:var(--amber);border:1px solid rgba(242,179,61,.4);border-radius:6px;padding:2px 8px}
.shead h1{font-size:30px;font-weight:600;line-height:1.1}
.shead p{margin:6px 0 0;color:var(--text-2);max-width:72ch}
.shead .grow{flex:1;min-width:260px}
.shead .acts{display:flex;gap:8px;align-items:center}

.lab{display:grid;grid-template-columns:minmax(0,1fr) var(--tasks);gap:20px;align-items:start}
.lab.notasks{grid-template-columns:minmax(0,1fr)}
.lab.notasks .tasks{display:none}
.ws{min-width:0;display:flex;flex-direction:column;gap:18px}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg)}
.panel>.ph{display:flex;align-items:center;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.panel>.ph h3{font-size:16px;font-weight:600}
.panel>.ph .sub{color:var(--muted);font-size:12.5px}
.panel>.pb{padding:16px}
.panel.flat{background:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.muted{color:var(--muted)}
.t2{color:var(--text-2)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#3E5A90}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:600}
.btn.pri:hover{background:var(--amber-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.danger{border-color:rgba(255,107,107,.5);color:#FFB3B3;background:var(--red-wash)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none}
.inp:focus{border-color:var(--amber)}
textarea.inp{font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
.seg{display:inline-flex;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:500}
.seg button.on{background:var(--panel-3);color:var(--text)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-soft);padding:0 10px;overflow:auto}
.tabs button{border:0;background:transparent;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--amber)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.chip.pass{color:var(--green);border-color:rgba(69,204,138,.45);background:var(--green-wash)}
.chip.fail{color:var(--red);border-color:rgba(255,107,107,.45);background:var(--red-wash)}
.chip.warn{color:var(--amber);border-color:rgba(242,179,61,.45);background:var(--amber-wash)}
.chip.info{color:var(--cyan);border-color:rgba(92,200,255,.4);background:var(--cyan-wash)}

/* ───────── tasks panel ───────── */
.tasks{position:sticky;top:0;display:flex;flex-direction:column;gap:10px}
.tasks .tp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 4px}
.tasks .tp-head h3{font-size:16px}
.tasks .tp-head span{font:500 12px var(--mono);color:var(--muted)}
.task{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;position:relative}
.task.done{border-color:rgba(69,204,138,.35);background:linear-gradient(180deg,rgba(69,204,138,.07),transparent 70%),var(--panel)}
.task .tq{display:flex;gap:10px}
.task .tq .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--mono);background:var(--panel-3);color:var(--text-2);margin-top:1px}
.task.done .tq .k{background:var(--green);color:#06231a}
.task .tq p{margin:0;font-size:13.5px;line-height:1.45;padding-right:44px}
.task .pts{position:absolute;right:12px;top:10px;font:500 11px var(--mono);color:var(--muted)}
.task .ta{margin-top:10px;display:flex;gap:6px}
.task .ta .inp{height:34px;padding:6px 10px;font-family:var(--mono);font-size:12.5px}
.task .choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.task .choices button{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:13px;line-height:1.35}
.task .choices button:hover{border-color:#3E5A90}
.task .choices button.bad{border-color:rgba(255,107,107,.6);color:#FFB8B8}
.task .choices button.good{border-color:var(--green);color:var(--green)}
.task .fb{font-size:12.5px;margin-top:8px;color:var(--red)}
.task .ex{font-size:12.5px;margin-top:8px;color:var(--text-2);border-left:2px solid var(--green);padding-left:10px}
.task .ex b{color:var(--green);font-weight:600}
.task .hint{margin-top:8px;font-size:12.5px;color:var(--amber-2);background:var(--amber-wash);border-radius:8px;padding:8px 10px}
.task .hintbtn{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-top:8px;text-decoration:underline}
.task .hintbtn:hover{color:var(--amber)}
.task .auto{margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--mono)}
.task.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.nextbar{margin-top:6px;display:flex;justify-content:flex-end}

/* ───────── evidence markers ───────── */
.tent{flex:none;width:26px;height:22px;display:grid;place-items:end center;padding-bottom:2px;font:700 11px var(--mono);color:var(--amber-ink);background:var(--amber);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.drawer{position:fixed;top:var(--top);right:0;bottom:0;width:min(440px,100vw);background:var(--ink-2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s ease;z-index:20;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.drawer .dh h3{font-size:18px;flex:1}
.drawer .db{flex:1;overflow:auto;padding:14px 16px}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.ioc{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.ioc .v{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.ioc .meta{font-size:11.5px;color:var(--muted)}
.ioc .ty{font-size:10.5px;font-weight:600;color:var(--cyan);border:1px solid rgba(92,200,255,.35);border-radius:4px;padding:0 5px;margin-right:6px}
.ioc .acts{margin-left:auto;display:flex;gap:4px}
.ioc .acts button{border:1px solid var(--line);background:transparent;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer;color:var(--text-2)}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}

/* toolbox */
.tb-ops{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tb-ops button{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;color:var(--text-2)}
.tb-ops button.on{border-color:var(--amber);color:var(--amber);background:var(--amber-wash)}
.tb-out{margin-top:10px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;min-height:90px;max-height:330px;overflow:auto}
.tb-label{font-size:12px;color:var(--muted);margin:10px 0 4px;display:flex;justify-content:space-between}

/* toast */
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:40;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:#0A1222;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:13.5px;animation:tin .25s ease}
.toast.ok{border-color:rgba(69,204,138,.5)}
.toast.ev{border-color:rgba(242,179,61,.6)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,20,.65);display:none;place-items:center;z-index:50;padding:16px}
.modal-bg.open{display:grid}
.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal .mh{padding:16px 18px 6px;display:flex;gap:10px;align-items:center}
.modal .mh h3{font-size:18px;flex:1}
.modal .mb{padding:6px 18px 16px;color:var(--text-2)}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}

/* code / raw */
.raw{font:12.5px/1.6 var(--mono);background:#0A1120;border:1px solid var(--line-soft);border-radius:10px;overflow:auto;white-space:pre;color:#C9D4E8}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}

/* ───────── brief ───────── */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
.alert{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden;position:relative}
.alert .bandr{height:4px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#7a2a32 12px 24px)}
.alert .ah{padding:16px 20px 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert .ah h2{font-size:22px;flex:1;min-width:240px}
.mailcard{margin:12px 20px 20px;background:#F7F8FA;color:#1d2433;border-radius:12px;padding:16px 18px;font-family:'Segoe UI',var(--sans)}
.mailcard .fr{display:flex;gap:12px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:#C7D2E6;color:#22314f;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.mailcard .sj{font-weight:600;font-size:16px;margin:12px 0 4px}
.mailcard .pv{color:#4a5468;font-size:13.5px}
.attch{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:6px 10px;border:1px solid #D7DCE6;border-radius:8px;background:#fff;font-size:12.5px;color:#22314f}
.facts{display:grid;gap:10px}
.fact{display:flex;gap:14px;align-items:baseline;padding:12px 16px;background:var(--panel);border:1px solid var(--line-soft);border-radius:12px}
.fact span{color:var(--muted);font-size:12.5px;min-width:96px}
.fact b{font-weight:500}
.relay{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;padding:18px 6px 6px}
.relay:before{content:"";position:absolute;left:5%;right:5%;top:37px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.relay .hop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;cursor:pointer;background:none;border:0;padding:0 4px;color:var(--text-2)}
.relay .hop .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line);position:relative;z-index:1;font:600 13px var(--mono)}
.relay .hop:hover .c{border-color:var(--amber);color:var(--amber)}
.relay .hop.done .c{background:var(--green);border-color:var(--green);color:#06231a}
.relay .hop b{font-size:12.5px;font-weight:500;line-height:1.25}
.relay .hop small{font:11px var(--mono);color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.howto div{padding:14px 16px;border:1px solid var(--line-soft);border-radius:12px;background:var(--panel)}
.howto b{display:block;font-family:var(--cond);font-size:16px;margin-bottom:2px}
.howto p{margin:0;color:var(--text-2);font-size:13px}

/* ───────── anatomy ───────── */
.layers{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:stretch}
.env{position:relative;border:2px dashed #3A5280;border-radius:16px;padding:14px;cursor:pointer;transition:border-color .2s}
.env .lt{font:600 12px var(--mono);color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.env .lv{font:12px/1.7 var(--mono);color:var(--text-2)}
.env .hdr{margin-top:12px;border:2px solid #3A5280;border-radius:12px;padding:12px;background:rgba(92,200,255,.04)}
.env .bod{margin-top:12px;border:2px solid #3A5280;border-radius:10px;padding:12px;background:rgba(180,156,255,.05)}
.env .sel,.env.sel{border-color:var(--amber)!important}
.authgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.auth{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:16px}
.auth h3{font-size:22px;display:flex;justify-content:space-between;align-items:center}
.auth p{margin:6px 0 10px;color:var(--text-2);font-size:13px}
.auth .q{font-size:12px;color:var(--muted)}
.auth .q b{color:var(--text);font-family:var(--mono);font-weight:500}
.align{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) ;gap:12px}
.align label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.verdict div{border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;background:var(--ink)}
.verdict div small{display:block;color:var(--muted);font-size:11.5px}
.verdict div b{font-family:var(--cond);font-size:17px}

/* ───────── header lab ───────── */
.hops{display:flex;align-items:stretch;gap:30px;overflow-x:auto;padding:6px 2px 10px}
.hopn{flex:1 0 128px;min-width:128px;position:relative}
.hopn .card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--ink);height:100%;overflow:hidden}
.hopn .card.origin{border-color:rgba(255,107,107,.55);background:linear-gradient(180deg,rgba(255,107,107,.08),transparent),var(--ink)}
.hopn .card.trust{border-color:rgba(242,179,61,.6)}
.hopn .card.ms{border-color:rgba(92,200,255,.35)}
.hopn .idx{font:600 11px var(--mono);color:var(--muted)}
.hopn .host{font:500 12.5px var(--mono);word-break:break-all;margin:3px 0}
.hopn .ip{font:600 12.5px var(--mono);color:var(--cyan)}
.hopn .proto{font-size:11.5px;color:var(--muted);word-break:break-all}
.hopn .ip{word-break:break-all}
.hopn .tag{display:inline-block;margin-top:6px;font-size:11px;padding:1px 7px;border-radius:99px}
.hopn .tag.o{background:var(--red-wash);color:var(--red)}
.hopn .tag.t{background:var(--amber-wash);color:var(--amber)}
.hopn .lag{position:absolute;left:calc(100% + 15px);top:50%;transform:translate(-50%,-50%);white-space:nowrap;z-index:2;font:600 11px var(--mono);color:var(--text-2);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 6px}
.hopn .lag.slow{color:var(--red);border-color:rgba(255,107,107,.6)}
.hdrs{max-height:560px;overflow:auto;padding:6px 0}
.hl{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 14px 4px 12px;font:12.3px/1.55 var(--mono);color:#C9D4E8;white-space:pre-wrap;word-break:break-all;cursor:pointer;border-left:3px solid transparent}
.hl:hover{background:rgba(255,255,255,.03)}
.hl.on{background:var(--amber-wash);border-left-color:var(--amber)}
.hl .hn{color:var(--cyan)}
.hl.flag .hn{color:var(--pink)}
.hl .mark{color:var(--amber);font-weight:600}
.inspector h3{font-size:18px;font-family:var(--mono);font-weight:500;word-break:break-all}
.inspector .why{color:var(--text-2);font-size:13.5px;margin:8px 0 12px}
.inspector .fields{display:grid;gap:6px}
.inspector .fld{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:12.5px;padding:6px 8px;border-radius:7px;background:var(--ink)}
.inspector .fld b{font-family:var(--mono);color:var(--amber);font-weight:500;word-break:break-all}
.inspector .fld span{color:var(--text-2)}
.flags{display:grid;gap:8px}
.flagi{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line-soft);font-size:13px}
.flagi .sev{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.flagi .sev.h{background:var(--red)} .flagi .sev.m{background:var(--amber)} .flagi .sev.l{background:var(--cyan)}
.flagi b{font-weight:600}
.flagi small{display:block;color:var(--muted)}
.authrow{display:flex;gap:10px;flex-wrap:wrap}
.authbox{flex:1 1 120px;border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;background:var(--ink)}
.authbox small{color:var(--muted);font-size:11.5px;display:block}
.authbox b{font-family:var(--cond);font-size:18px;display:block;text-transform:none}
.authbox .d{font:11.5px var(--mono);color:var(--text-2);word-break:break-all}
.authbox.pass b{color:var(--green)} .authbox.fail b{color:var(--red)} .authbox.none b{color:var(--amber)}

/* ───────── eml lab ───────── */
.client{background:#F4F6F9;color:#1d2433;border-radius:0 0 14px 14px;font-family:'Segoe UI',system-ui,sans-serif;position:relative}
.client .ch{padding:18px 22px 12px;border-bottom:1px solid #DFE3EA}
.client .ch h2{font-family:'Segoe UI',system-ui,sans-serif;font-size:19px;font-weight:600;color:#111827;margin-bottom:12px;letter-spacing:0}
.client .from{display:flex;gap:12px;align-items:center}
.client .from b{font-weight:600}
.client .from .addr{color:#5b6475;font-size:13px}
.client .meta{font-size:12.5px;color:#5b6475}
.client .cbody{padding:16px 22px 34px;min-height:220px;background:#fff}
.client .status{position:absolute;left:0;bottom:0;max-width:92%;background:#E8EBF0;border:1px solid #CDD3DD;border-radius:0 6px 0 12px;font:12px var(--mono);padding:3px 10px;color:#2b3445;opacity:0;transition:opacity .12s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client .status.show{opacity:1}
.mime{display:grid;grid-template-columns:280px minmax(0,1fr);gap:0;min-height:420px}
.mtree{border-right:1px solid var(--line-soft);padding:12px 8px;font:12.5px var(--mono)}
.mtree button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--text-2);font:12.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtree button:hover{background:var(--panel-2)}
.mtree button.on{background:var(--amber-wash);color:var(--amber)}
.mtree .lvl1{padding-left:24px}.mtree .lvl2{padding-left:42px}
.mpart{padding:14px;min-width:0}
.mpart .raw{max-height:330px;padding:12px}
.arts{display:grid;gap:10px}
.art{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--ink);border:1px solid var(--line-soft);border-radius:10px}
.art .ty{font-size:11px;font-weight:600;color:var(--cyan);min-width:70px}
.art .v{font:12.5px var(--mono);word-break:break-all;flex:1}

/* ───────── osint ───────── */
.osint{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:480px}
.otools{border-right:1px solid var(--line-soft);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.otools button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-2);font-size:13px}
.otools button:hover{background:var(--panel-2)}
.otools button.on{background:var(--panel-3);color:var(--text)}
.otools button i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--ink);font-style:normal;font:600 11px var(--mono);color:var(--cyan);flex:none}
.oview{padding:16px;min-width:0}
.osearch{display:flex;gap:8px}
.osearch .inp{font-family:var(--mono);font-size:13px;height:40px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.qchips button{border:1px dashed var(--line);background:transparent;color:var(--text-2);font:11.5px var(--mono);border-radius:6px;padding:3px 8px;cursor:pointer}
.qchips button:hover{border-color:var(--amber);color:var(--amber)}
.ores{border:1px solid var(--line-soft);border-radius:12px;background:var(--ink);padding:16px;min-height:220px}
.score{display:flex;align-items:center;gap:18px}
.ring{--p:0;--c:var(--red);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--panel-3) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--ink);display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--cond);font-size:22px}
.ring small{font-size:10.5px;color:var(--muted)}
.engines{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;margin-top:14px;font-size:12.5px}
.engines div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line-soft);padding:4px 0}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:#1b1b1b;max-width:420px}
.shot .bar{background:#E9ECF1;padding:6px 10px;font:11.5px var(--mono);color:#444;display:flex;gap:6px;align-items:center}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:#d0d4db;display:inline-block}
.shot .pg{padding:28px 30px;font-family:'Segoe UI',sans-serif}
.shot .pg .lg{font-weight:700;color:#0f6cbd;margin-bottom:14px}
.shot .pg .fi{border-bottom:1px solid #888;padding:6px 0;color:#777;font-size:13px;margin:10px 0}
.shot .pg .bt{background:#0f6cbd;color:#fff;text-align:center;padding:7px;margin-top:16px;font-size:13px;width:110px;margin-left:auto}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.links a{display:block;padding:10px 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--ink);text-decoration:none;color:var(--text)}
.links a:hover{border-color:var(--cyan)}
.links a b{display:block;font-weight:500;font-size:13.5px}
.links a small{color:var(--muted);font-size:12px}

/* ───────── KQL hunting ───────── */
.hunt{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:600px}
.schema{border-right:1px solid var(--line-soft);padding:10px 6px;overflow:auto;max-height:760px;font-size:12.5px}
.schema details{border-radius:7px}
.schema summary{cursor:pointer;padding:6px 8px;border-radius:7px;font:500 12.5px var(--mono);color:var(--text);list-style:none;display:flex;justify-content:space-between}
.schema summary::-webkit-details-marker{display:none}
.schema summary:hover{background:var(--panel-2)}
.schema summary span{color:var(--muted);font-size:11px}
.schema .cols button{display:block;width:100%;text-align:left;border:0;background:none;padding:2px 8px 2px 22px;font:11.5px var(--mono);color:var(--text-2);cursor:pointer}
.schema .cols button:hover{color:var(--amber)}
.schema .cols button em{font-style:normal;color:var(--muted);font-size:10.5px;margin-left:6px}
.qpane{display:flex;flex-direction:column;min-width:0}
.qbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.editor{position:relative;height:200px;background:#0A1120;border-bottom:1px solid var(--line-soft)}
.editor pre,.editor textarea{position:absolute;inset:0;margin:0;padding:12px 14px;font:13px/1.6 var(--mono);white-space:pre-wrap;word-wrap:break-word;overflow:auto;border:0;tab-size:4}
.editor textarea{background:transparent;color:transparent;caret-color:var(--amber);resize:none;outline:none}
.editor pre{color:#C9D4E8;pointer-events:none}
.k-kw{color:var(--violet)} .k-tb{color:var(--cyan)} .k-st{color:#9BE39B} .k-fn{color:var(--amber-2)} .k-op{color:var(--pink)} .k-cm{color:#5e6f8f;font-style:italic} .k-nu{color:#FFB38A}
.rmeta{display:flex;gap:14px;align-items:center;padding:8px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line-soft)}
.rmeta b{color:var(--text)}
.rmeta .err{color:var(--red);font-family:var(--mono);font-size:12px}
.grid{overflow:auto;max-height:430px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font:12px/1.45 var(--mono)}
table.dt th{position:sticky;top:0;background:var(--panel-2);color:var(--text-2);text-align:left;font-weight:500;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;color:#D2DBEC;cursor:copy}
table.dt tr:hover td{background:rgba(92,200,255,.05)}
table.dt td.hit{color:var(--amber)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:14px 12px 4px}
.bars div{flex:1;background:var(--cyan);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10.5px var(--mono);color:var(--text-2)}
.blabels{display:flex;gap:4px;padding:0 12px 10px}
.blabels span{flex:1;font:10px var(--mono);color:var(--muted);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ───────── purview ───────── */
.pv-form{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pv-form>*,.grid2>*,.grid3>*,.panel,.pb{min-width:0}
.pv-form label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px}
.cond{display:grid;grid-template-columns:170px minmax(0,1fr) 34px;gap:8px;align-items:center}
.cond .x{width:34px;height:34px}
.kql-prev{font:12.5px/1.5 var(--mono);background:#0A1120;border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;color:#C9D4E8;word-break:break-word}
.banner{display:flex;gap:12px;padding:12px 14px;border-radius:10px;font-size:13.5px;align-items:flex-start}
.banner.ok{background:var(--green-wash);border:1px solid rgba(69,204,138,.45)}
.banner.warn{background:var(--amber-wash);border:1px solid rgba(242,179,61,.45)}
.banner.bad{background:var(--red-wash);border:1px solid rgba(255,107,107,.45)}
.banner b{display:block}
.stats{display:flex;gap:26px;padding:6px 2px 12px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--cond);font-size:26px;line-height:1.1}
.stats div small{color:var(--muted);font-size:12px}
.acts-chips{display:flex;flex-wrap:wrap;gap:6px}
.acts-chips button{border:1px solid var(--line);background:var(--ink);border-radius:99px;padding:4px 11px;font:12px var(--mono);cursor:pointer;color:var(--text-2)}
.acts-chips button.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-wash)}
.json{font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;background:#0A1120;border:1px solid var(--line-soft);border-radius:10px;padding:12px;max-height:380px;overflow:auto;color:#C9D4E8}
.json .jk{color:var(--cyan)} .json .js{color:#9BE39B} .json .jn{color:#FFB38A}

/* ───────── response ───────── */
.ps{background:var(--ps);border-radius:12px;border:1px solid #1B3E78;overflow:hidden;display:flex;flex-direction:column;height:560px}
.ps .psh{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0B1B3D;border-bottom:1px solid #1B3E78;font-size:12.5px;color:#9FB6E0}
.ps .psh .conn{display:flex;gap:6px;margin-left:auto}
.ps .psh .conn span{font:11px var(--mono);padding:1px 7px;border-radius:99px;border:1px solid #2a4a85;color:#6f88b8}
.ps .psh .conn span.on{color:#7CF0B4;border-color:#2f8f68}
.ps .out{flex:1;overflow:auto;padding:12px 14px;font:12.8px/1.5 var(--mono);color:#EEEDF0;white-space:pre-wrap;word-break:break-word}
.ps .out .t{white-space:pre;word-break:normal}
.ps .out .p{color:#EEEDF0} .ps .out .c{color:#FFF} .ps .out .e{color:#FF8A8A} .ps .out .w{color:#FFD66B} .ps .out .g{color:#7CF0B4} .ps .out .d{color:#9FB6E0}
.ps .inrow{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid #1B3E78;font:12.8px var(--mono);color:#EEEDF0}
.ps .inrow input{flex:1;background:transparent;border:0;outline:none;color:#FFF;font:12.8px var(--mono)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.act{background:var(--ink);border:1px solid var(--line-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.act h4{font-size:15px}
.act p{margin:0;font-size:12.5px;color:var(--muted)}
.act.done{border-color:rgba(69,204,138,.45)}
.alog{font:12px/1.6 var(--mono);color:var(--text-2);max-height:120px;overflow:auto}

/* ───────── harden ───────── */
.posture{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center}
.gauge{position:relative;width:150px;height:150px}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .gv b{font-family:var(--cond);font-size:40px;line-height:1;display:block}
.gauge .gv small{color:var(--muted);font-size:12px}
.chain{display:flex;align-items:flex-start;gap:0}
.cnode{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 0;min-width:64px;position:relative;text-align:center}
.cnode:after{content:"";position:absolute;top:17px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--line)}
.cnode:last-child:after{display:none}
.cnode .ci{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:2px solid var(--red);background:var(--red-wash);color:var(--red);font:700 13px var(--mono);transition:all .3s}
.cnode.cov .ci{border-color:var(--green);background:var(--green-wash);color:var(--green)}
.cnode b{font-size:12px;font-weight:500;line-height:1.25;color:var(--text-2)}
.ctrls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ctrl{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--ink);align-items:flex-start}
.ctrl.on{border-color:rgba(69,204,138,.4)}
.ctrl .ct{flex:1;min-width:0}
.ctrl b{font-weight:600;font-size:13.5px;display:block}
.ctrl p{margin:2px 0 6px;font-size:12.5px;color:var(--muted)}
.ctrl code{font-size:11px;color:var(--text-2);display:block;word-break:break-all;background:var(--panel);padding:4px 6px;border-radius:5px}
.ctrl .stops{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ctrl .stops span{font-size:10.5px;padding:0 6px;border-radius:4px;background:var(--panel-3);color:var(--text-2)}
.sw{flex:none;width:40px;height:23px;border-radius:99px;background:var(--panel-3);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#9DB0D3;transition:transform .2s}
.sw.on{background:var(--green);border-color:var(--green)}
.sw.on:after{transform:translateX(17px);background:#fff}
.sel3{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:6px}
.sel3 button{border:0;background:var(--panel);padding:3px 9px;font:11.5px var(--mono);cursor:pointer;color:var(--text-2)}
.sel3 button.on{background:var(--amber);color:var(--amber-ink)}
.vlist{display:grid;gap:5px;margin-top:10px;font-size:12.5px}
.vlist div{display:flex;gap:8px;align-items:flex-start}
.vlist .i{flex:none;width:16px;text-align:center;font-weight:700}
.vlist .ok .i{color:var(--green)} .vlist .er .i{color:var(--red)} .vlist .wa .i{color:var(--amber)}
.lookups{font:12px var(--mono);color:var(--muted);margin-top:6px}
.lookups b{color:var(--text)}

/* ───────── debrief ───────── */
.paper{background:#FBFAF7;color:#1c2230;border-radius:14px;padding:34px 40px;font-family:var(--sans);max-width:880px}
.paper h2{font-family:var(--cond);font-size:26px;color:#0d1526}
.paper h3{font-family:var(--cond);font-size:17px;margin:22px 0 8px;color:#0d1526;border-bottom:1px solid #e3e0d7;padding-bottom:4px}
.paper p,.paper li{font-size:13.5px;line-height:1.55}
.paper table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper th,.paper td{text-align:left;padding:5px 8px;border-bottom:1px solid #e8e5dc;vertical-align:top}
.paper th{color:#5a6070;font-weight:600}
.paper code{font-family:var(--mono);font-size:11.8px;word-break:break-all}
.paper .meta{color:#5a6070;font-size:12.5px}
.paper .sevpill{display:inline-block;background:#c62828;color:#fff;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600}
.grade{display:flex;gap:22px;align-items:center}
.grade .big{font-family:var(--cond);font-size:64px;line-height:1;color:var(--amber)}

/* responsive */
@media (max-width:1180px){
  :root{--tasks:300px}
  .hero{grid-template-columns:1fr}
  .ctrls{grid-template-columns:1fr}
}
@media (max-width:980px){
  .toasts{right:16px;left:16px;align-items:stretch}
  body{overflow:auto}
  .app{display:block;height:auto}
  .top{position:sticky;top:0;flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}
  .brand{min-width:0}
  .clock,.casechip{display:none}
  .xp{min-width:140px;flex:1}
